name: Showcase checks
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'
    - name: Install controller validation dependencies
      run: python -m pip install -r harness/requirements.txt
    - name: Validate adapter and outcome contract
      run: |
        python harness/scripts/validate_adapters.py
        python -m unittest discover -s harness/evals -p 'test_agent_outcome.py' -v

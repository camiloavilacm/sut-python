{
  "openapi": "3.0.3",
  "info": {
    "title": "SEED-1 approved Conduit authentication contract",
    "version": "0.1.0",
    "description": "User-approved SEED-1 contract, frozen by seed-1-approved-v1. API paths are relative to the /api server prefix."
  },
  "servers": [
    {
      "url": "http://localhost:8000/api",
      "description": "Override per SUT; no implementation supplied"
    }
  ],
  "paths": {
    "/users": {
      "post": {
        "operationId": "register",
        "summary": "register",
        "security": [],
        "responses": {
          "201": {
            "description": "Successful user response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UserEnvelope"
                }
              }
            }
          },
          "422": {
            "description": "Invalid input; login with an incorrect password returns errors.email or password = [is invalid].",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Errors"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "user"
                ],
                "properties": {
                  "user": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": [
                      "username",
                      "email",
                      "password"
                    ],
                    "properties": {
                      "username": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 64
                      },
                      "email": {
                        "type": "string",
                        "minLength": 1,
                        "format": "email"
                      },
                      "password": {
                        "type": "string",
                        "minLength": 8,
                        "writeOnly": true
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/users/login": {
      "post": {
        "operationId": "login",
        "summary": "login",
        "security": [],
        "responses": {
          "200": {
            "description": "Successful user response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UserEnvelope"
                }
              }
            }
          },
          "422": {
            "description": "Invalid input; login with an incorrect password returns errors.email or password = [is invalid].",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Errors"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "user"
                ],
                "properties": {
                  "user": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": [
                      "email",
                      "password"
                    ],
                    "properties": {
                      "email": {
                        "type": "string",
                        "minLength": 1,
                        "format": "email"
                      },
                      "password": {
                        "type": "string",
                        "minLength": 8,
                        "writeOnly": true
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/user": {
      "get": {
        "operationId": "currentUser",
        "summary": "currentUser",
        "security": [
          {
            "TokenAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Successful user response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UserEnvelope"
                }
              }
            }
          },
          "401": {
            "description": "Missing, expired or invalid authentication token; no authenticated user returned."
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "TokenAuth": {
        "type": "apiKey",
        "in": "header",
        "name": "Authorization",
        "description": "Exactly Token <jwt>; never Bearer."
      }
    },
    "schemas": {
      "User": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "email",
          "username",
          "token",
          "bio",
          "image"
        ],
        "properties": {
          "email": {
            "type": "string",
            "format": "email"
          },
          "username": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          },
          "token": {
            "type": "string",
            "minLength": 1,
            "pattern": "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"
          },
          "bio": {
            "type": "string",
            "nullable": true
          },
          "image": {
            "type": "string",
            "nullable": true
          }
        }
      },
      "UserEnvelope": {
        "type": "object",
        "required": [
          "user"
        ],
        "additionalProperties": false,
        "properties": {
          "user": {
            "$ref": "#/components/schemas/User"
          }
        }
      },
      "Errors": {
        "type": "object",
        "required": [
          "errors"
        ],
        "additionalProperties": false,
        "properties": {
          "errors": {
            "type": "object",
            "minProperties": 1,
            "additionalProperties": {
              "type": "array",
              "minItems": 1,
              "items": {
                "type": "string"
              }
            }
          }
        }
      }
    }
  }
}
